<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Leigen Command</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #1a1d23;
    color: #d1d5db;
    min-height: 100vh;
    line-height: 1.7;
    font-size: 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* Password Gate */
  #gate {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #1a1d23;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }
  #gate.dismissed { display: none; }
  #gate h2 {
    font-size: 24px;
    font-weight: 700;
    color: #f3f4f6;
    margin-bottom: 6px;
  }
  .gate-sub {
    font-size: 15px;
    color: #9ca3af;
    margin-bottom: 28px;
  }
  #gate input {
    font-family: inherit;
    font-size: 17px;
    padding: 14px 20px;
    background: #242830;
    border: 1px solid #374151;
    border-radius: 8px;
    color: #f3f4f6;
    text-align: center;
    outline: none;
    width: 300px;
  }
  #gate input:focus { border-color: #6b7280; box-shadow: 0 0 0 3px rgba(107,114,128,0.2); }
  #gate input::placeholder { color: #6b7280; }
  .gate-error {
    color: #f87171;
    font-size: 14px;
    margin-top: 12px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .gate-error.show { opacity: 1; }

  /* Container */
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 28px 80px;
  }

  /* Header */
  .header {
    margin-bottom: 52px;
    padding-bottom: 28px;
    border-bottom: 1px solid #2d3139;
  }
  .header h1 {
    font-size: 38px;
    font-weight: 700;
    color: #f9fafb;
    margin-bottom: 4px;
  }
  .header-subtitle {
    font-size: 18px;
    color: #9ca3af;
    margin-bottom: 22px;
  }
  .header-meta {
    display: flex;
    gap: 28px;
    font-size: 18px;
    align-items: baseline;
  }
  .target-date { color: #9ca3af; }
  .target-date span { color: #f3f4f6; font-weight: 600; }
  .countdown {
    font-weight: 600;
    color: #fbbf24;
  }
  .countdown-past { color: #f87171; }
  .countdown-today { color: #34d399; }
  .last-updated {
    font-size: 14px;
    color: #6b7280;
    margin-top: 8px;
  }

  /* Sections */
  .section {
    margin-bottom: 52px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: #9ca3af;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #2d3139;
  }

  /* Goals */
  .goals-list {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .goal-item {
    background: #242830;
    border: 1px solid #2d3139;
    border-radius: 8px;
    padding: 14px 16px;
  }
  .goal-text {
    font-size: 16px;
    font-weight: 600;
    color: #e5e7eb;
    line-height: 1.4;
  }
  .goal-detail {
    font-size: 14px;
    color: #9ca3af;
    margin-top: 4px;
    line-height: 1.45;
    font-weight: 400;
  }

  /* Project Cards */
  .projects { display: flex; flex-direction: column; gap: 16px; }
  .project-card {
    background: #242830;
    border: 1px solid #2d3139;
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 22px 24px 16px;
    cursor: pointer;
    user-select: none;
  }
  .card-title-block { flex: 1; min-width: 0; }
  .card-codename {
    font-size: 24px;
    font-weight: 700;
    color: #f9fafb;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .card-former {
    font-size: 15px;
    color: #6b7280;
  }
  .card-desc {
    font-size: 18px;
    color: #9ca3af;
    margin-top: 10px;
    line-height: 1.6;
  }
  .expand-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    color: #6b7280;
    flex-shrink: 0;
    margin-left: 24px;
    padding-top: 4px;
    transition: color 0.2s;
  }
  .card-header:hover .expand-hint { color: #9ca3af; }
  .chevron {
    font-size: 12px;
    transition: transform 0.3s ease;
    display: inline-block;
  }
  .project-card.open .chevron { transform: rotate(180deg); }
  .project-card.open .expand-label { display: none; }
  .expand-label-close { display: none; }
  .project-card.open .expand-label-close { display: inline; }

  /* Progress Bar */
  .card-progress {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px 20px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #1a1d23;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }
  .progress-pct {
    font-size: 18px;
    font-weight: 700;
    min-width: 44px;
    text-align: right;
    color: #d1d5db;
  }

  /* Collapsible Todos */
  .card-todos {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .project-card.open .card-todos { max-height: 600px; }
  .card-todos-inner {
    padding: 0 24px 20px;
    border-top: 1px solid #2d3139;
  }
  .todos-label {
    font-size: 12px;
    font-weight: 700;
    color: #6b7280;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-top: 16px;
  }
  .todo-list { list-style: none; }
  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    font-size: 18px;
  }
  .todo-check {
    flex-shrink: 0;
    width: 20px;
    font-size: 15px;
    margin-top: 2px;
  }
  .todo-pending .todo-check { color: #4b5563; }
  .todo-pending span:last-child { color: #d1d5db; }
  .todo-done .todo-check { color: #34d399; }
  .todo-done span:last-child { color: #34d399; text-decoration: line-through; opacity: 0.5; }


  /* Footer */
  .footer {
    text-align: center;
    padding-top: 32px;
    border-top: 1px solid #2d3139;
    margin-top: 16px;
  }
  .footer-text {
    font-size: 13px;
    color: #4b5563;
  }
  .footer-nav { margin-top: 6px; }
  .footer-nav a {
    font-size: 13px;
    color: #6b7280;
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-nav a:hover { color: #d1d5db; }

  /* Responsive */
  @media (max-width: 700px) {
    body { font-size: 18px; }
    .container { padding: 28px 18px 60px; }
    .header h1 { font-size: 26px; }
    .header-meta { flex-direction: column; gap: 4px; }
    .card-header { flex-direction: column; }
    .expand-hint {
      margin-left: 0;
      margin-top: 12px;
    }
    .card-codename { font-size: 19px; }
    .goals-list { grid-template-columns: 1fr; }
  }

  @media (max-width: 400px) {
    .container { padding: 20px 14px 40px; }
    .header h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- Password Gate -->
<div id="gate">
  <h2>Leigen Command</h2>
  <div class="gate-sub">Operational Dashboard</div>
  <input type="password" id="pw" placeholder="Access code" autocomplete="off">
  <div class="gate-error" id="err">Access denied</div>
</div>

<!-- Dashboard -->
<div class="container" id="app">

  <header class="header">
    <h1>Leigen Command</h1>
    <div class="header-subtitle">Operational Dashboard</div>
    <div class="header-meta">
      <span class="target-date">Target: <span id="targetDate">---</span></span>
      <span class="countdown" id="countdown">-- days</span>
    </div>
    <div class="last-updated">Data as of <span id="lastUpdated">---</span></div>
  </header>

  <section class="section">
    <h2 class="section-title">April 10 Objectives</h2>
    <ul class="goals-list" id="goalsList"></ul>
  </section>

  <section class="section">
    <h2 class="section-title">Active Projects</h2>
    <div class="projects" id="projectCards"></div>
  </section>

  <footer class="footer">
    <div class="footer-text">Leigen Command v1.0</div>
    <div class="footer-nav"><a href="/leigen/">Fleet Command</a></div>
  </footer>

</div>

<script>
(function() {
  var gate = document.getElementById('gate');
  var pw = document.getElementById('pw');
  var err = document.getElementById('err');

  if (localStorage.getItem('lg_cmd') === '1') {
    gate.classList.add('dismissed');
    loadDashboard();
    return;
  }

  pw.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (pw.value === 'bigbootylatina$') {
        localStorage.setItem('lg_cmd', '1');
        gate.style.opacity = '0';
        setTimeout(function() { gate.classList.add('dismissed'); loadDashboard(); }, 400);
      } else {
        err.classList.add('show');
        pw.value = '';
        setTimeout(function() { err.classList.remove('show'); }, 2000);
      }
    }
  });
  pw.focus();
})();

function loadDashboard() {
  fetch('data.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderCountdown(data.meta);
      renderGoals(data.goals);
      renderProjects(data.projects);
    })
    .catch(function(e) {
      console.error('Data load failed:', e);
    });
}

function formatDate(str) {
  var d = new Date(str + 'T12:00:00');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function renderCountdown(meta) {
  var target = new Date(meta.targetDate + 'T00:00:00');
  var now = new Date();
  now.setHours(0,0,0,0);
  var diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  var el = document.getElementById('countdown');

  if (diff > 0) {
    el.textContent = diff + ' days remaining';
  } else if (diff === 0) {
    el.textContent = 'Target day';
    el.className = 'countdown countdown-today';
  } else {
    el.textContent = Math.abs(diff) + ' days past target';
    el.className = 'countdown countdown-past';
  }

  document.getElementById('targetDate').textContent = formatDate(meta.targetDate);
  document.getElementById('lastUpdated').textContent = formatDate(meta.lastUpdated);
}

function renderGoals(goals) {
  var list = document.getElementById('goalsList');
  var html = '';
  goals.forEach(function(g) {
    html += '<li class="goal-item">' +
      '<div class="goal-text">' + g.text + '</div>' +
      (g.detail ? '<div class="goal-detail">' + g.detail + '</div>' : '') +
      '</li>';
  });
  list.innerHTML = html;
}

function renderProjects(projects) {
  var container = document.getElementById('projectCards');
  var html = '';
  projects.forEach(function(p) {
    var slug = p.codename.toLowerCase();
    var progColor = p.progress >= 70 ? '#34d399' : p.progress >= 30 ? '#fbbf24' : '#f87171';

    var todosHtml = '<div class="card-todos-inner"><div class="todos-label">To-do</div><ul class="todo-list">';
    p.todos.forEach(function(t) {
      var cls = t.done ? 'todo-done' : 'todo-pending';
      var icon = t.done ? '\u2713' : '\u25A1';
      todosHtml += '<li class="todo-item ' + cls + '"><span class="todo-check">' + icon + '</span><span>' + t.text + '</span></li>';
    });
    todosHtml += '</ul></div>';

    html += '<div class="project-card" id="card-' + slug + '">' +
      '<div class="card-header" onclick="toggleCard(\'' + slug + '\')">' +
        '<div class="card-title-block">' +
          '<h3 class="card-codename">' + p.codename + '</h3>' +
          '<span class="card-former">formerly ' + p.formerName + '</span>' +
          '<p class="card-desc">' + p.description + '</p>' +
        '</div>' +
        '<div class="expand-hint">' +
          '<span class="expand-label">View tasks</span>' +
          '<span class="expand-label-close">Hide</span>' +
          ' <span class="chevron">\u25BC</span>' +
        '</div>' +
      '</div>' +
      '<div class="card-progress">' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + p.progress + '%; background:' + progColor + ';"></div></div>' +
        '<span class="progress-pct">' + p.progress + '%</span>' +
      '</div>' +
      '<div class="card-todos">' + todosHtml + '</div>' +
    '</div>';
  });
  container.innerHTML = html;
}

function toggleCard(slug) {
  document.getElementById('card-' + slug).classList.toggle('open');
}

</script>

</body>
</html>
