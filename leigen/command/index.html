<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Leigen Command</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #111118;
    color: #e0e0e8;
    min-height: 100vh;
    line-height: 1.7;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }

  /* Password Gate */
  #gate {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #111118;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }
  #gate.dismissed { display: none; }
  #gate h2 {
    font-size: 22px;
    font-weight: 700;
    color: #e0e0e8;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .gate-sub {
    font-size: 13px;
    color: #666;
    margin-bottom: 28px;
  }
  #gate input {
    font-family: inherit;
    font-size: 15px;
    padding: 12px 18px;
    background: #1a1a24;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e8;
    text-align: center;
    outline: none;
    width: 280px;
  }
  #gate input:focus { border-color: #5b8def; box-shadow: 0 0 0 3px rgba(91,141,239,0.15); }
  #gate input::placeholder { color: #555; }
  .gate-error {
    color: #ef4444;
    font-size: 13px;
    margin-top: 12px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .gate-error.show { opacity: 1; }

  /* Container */
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Header */
  .header {
    margin-bottom: 48px;
    padding-bottom: 28px;
    border-bottom: 1px solid #222;
  }
  .header h1 {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 2px;
    letter-spacing: 0.5px;
  }
  .header-subtitle {
    font-size: 16px;
    color: #666;
    margin-bottom: 20px;
  }
  .header-meta {
    display: flex;
    gap: 24px;
    font-size: 16px;
    align-items: baseline;
  }
  .target-date { color: #999; }
  .target-date span { color: #e0e0e8; font-weight: 600; }
  .countdown {
    font-weight: 600;
    color: #f59e0b;
  }
  .countdown-past { color: #ef4444; }
  .countdown-today { color: #22c55e; }
  .last-updated {
    font-size: 12px;
    color: #555;
    margin-top: 6px;
  }

  /* Sections */
  .section {
    margin-bottom: 44px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #1e1e28;
  }

  /* Goals */
  .goals-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .goal-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 8px;
    background: #1a1a24;
    border: 1px solid #252530;
    transition: background 0.15s;
  }
  .goal-item:hover { background: #1e1e2a; }
  .goal-icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-top: 1px;
  }
  .goal-text { font-size: 16px; font-weight: 500; line-height: 1.4; }
  .goal-detail {
    font-size: 13px;
    color: #777;
    margin-top: 4px;
    line-height: 1.5;
    font-weight: 400;
  }
  .goal-not-started .goal-icon { color: #444; }
  .goal-not-started .goal-text { color: #777; }
  .goal-in-progress .goal-icon { color: #f59e0b; }
  .goal-in-progress .goal-text { color: #e0e0e8; }
  .goal-done .goal-icon { color: #22c55e; }
  .goal-done .goal-text { color: #22c55e; }

  /* Project Cards */
  .projects { display: flex; flex-direction: column; gap: 14px; }
  .project-card {
    background: #1a1a24;
    border: 1px solid #252530;
    border-left: 4px solid var(--accent, #555);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .project-card:hover { border-color: #333; border-left-color: var(--accent); }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px 22px 14px;
    cursor: pointer;
    user-select: none;
  }
  .card-title-block { flex: 1; min-width: 0; }
  .card-codename {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent, #fff);
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .card-former {
    font-size: 12px;
    color: #666;
  }
  .card-desc {
    font-size: 15px;
    color: #999;
    margin-top: 8px;
    line-height: 1.55;
  }
  .card-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 24px;
  }
  .milestone-badge {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 5px 12px;
    border: 1px solid var(--accent, #555);
    border-radius: 6px;
    color: var(--accent, #555);
    white-space: nowrap;
  }
  .risk-badge {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 6px;
  }
  .risk-low { background: rgba(34,197,94,0.12); color: #22c55e; }
  .risk-medium { background: rgba(245,158,11,0.12); color: #f59e0b; }
  .risk-high { background: rgba(239,68,68,0.12); color: #ef4444; }
  .chevron {
    font-size: 11px;
    color: #555;
    transition: transform 0.3s ease;
    display: inline-block;
  }
  .project-card.open .chevron { transform: rotate(180deg); }

  /* Progress Bar */
  .card-progress {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 22px 18px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #252530;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }
  .progress-pct {
    font-size: 14px;
    font-weight: 700;
    min-width: 40px;
    text-align: right;
  }

  /* Risk Note */
  .risk-note {
    font-size: 12px;
    color: #666;
    padding: 0 22px 14px;
    font-style: italic;
  }

  /* Collapsible Todos */
  .card-todos {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .project-card.open .card-todos { max-height: 600px; }
  .card-todos-inner {
    padding: 0 22px 18px;
    border-top: 1px solid #252530;
  }
  .todos-label {
    font-size: 11px;
    font-weight: 700;
    color: #666;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-top: 14px;
  }
  .todo-list { list-style: none; }
  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    font-size: 15px;
  }
  .todo-check {
    flex-shrink: 0;
    width: 18px;
    font-size: 14px;
    margin-top: 2px;
  }
  .todo-pending .todo-check { color: #555; }
  .todo-pending span:last-child { color: #bbb; }
  .todo-done .todo-check { color: #22c55e; }
  .todo-done span:last-child { color: #22c55e; text-decoration: line-through; opacity: 0.5; }

  /* Infrastructure */
  .infra-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .infra-item {
    background: #1a1a24;
    border: 1px solid #252530;
    border-radius: 8px;
    padding: 16px 12px;
    text-align: center;
  }
  .infra-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-bottom: 10px;
  }
  .infra-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #bbb;
    margin-bottom: 2px;
    line-height: 1.35;
  }
  .infra-detail {
    display: block;
    font-size: 11px;
    color: #666;
    margin-bottom: 8px;
  }
  .infra-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .status-healthy .infra-dot { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.35); }
  .status-healthy .infra-badge { background: rgba(34,197,94,0.12); color: #22c55e; }
  .status-warning .infra-dot { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,0.35); }
  .status-warning .infra-badge { background: rgba(245,158,11,0.12); color: #f59e0b; }
  .status-down .infra-dot { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.35); animation: pulse-red 1.5s infinite; }
  .status-down .infra-badge { background: rgba(239,68,68,0.12); color: #ef4444; }
  @keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* Pipeline Funnel */
  .funnel {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .funnel-stage {
    text-align: center;
    padding: 20px 28px;
    background: #1a1a24;
    border: 1px solid #252530;
    border-radius: 8px;
    min-width: 110px;
  }
  .funnel-count {
    font-size: 32px;
    font-weight: 800;
    color: var(--stage-color, #e0e0e8);
    margin-bottom: 4px;
  }
  .funnel-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #777;
  }
  .funnel-arrow {
    color: #3a3a48;
    font-size: 18px;
    padding: 0 10px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding-top: 32px;
    border-top: 1px solid #1e1e28;
    margin-top: 16px;
  }
  .footer-text {
    font-size: 12px;
    color: #444;
  }
  .footer-nav { margin-top: 6px; }
  .footer-nav a {
    font-size: 12px;
    color: #5b8def;
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-nav a:hover { color: #7aa5f5; }

  /* Responsive */
  @media (max-width: 700px) {
    body { font-size: 16px; }
    .container { padding: 24px 16px 60px; }
    .header h1 { font-size: 22px; }
    .header-meta { flex-direction: column; gap: 4px; }
    .goals-grid { grid-template-columns: 1fr; }
    .card-header { flex-direction: column; }
    .card-meta {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      margin-left: 0;
      margin-top: 12px;
      gap: 6px;
    }
    .card-codename { font-size: 17px; }
    .pipeline-matrix { grid-template-columns: repeat(2, 1fr); }
    .infra-grid { grid-template-columns: repeat(2, 1fr); }
    .funnel { flex-direction: column; gap: 6px; }
    .funnel-arrow { transform: rotate(90deg); padding: 0; }
    .funnel-stage { min-width: 180px; }
  }

  @media (max-width: 400px) {
    .container { padding: 16px 12px 40px; }
    .header h1 { font-size: 19px; }
    .infra-grid { grid-template-columns: 1fr; }
    .pipeline-matrix { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Password Gate -->
<div id="gate">
  <h2>Leigen Command</h2>
  <div class="gate-sub">Operational Dashboard</div>
  <input type="password" id="pw" placeholder="Access code" autocomplete="off">
  <div class="gate-error" id="err">Access denied</div>
</div>

<!-- Dashboard -->
<div class="container" id="app">

  <header class="header">
    <h1>Leigen Command</h1>
    <div class="header-subtitle">Operational Dashboard</div>
    <div class="header-meta">
      <span class="target-date">Target: <span id="targetDate">---</span></span>
      <span class="countdown" id="countdown">-- days</span>
    </div>
    <div class="last-updated">Data as of <span id="lastUpdated">---</span></div>
  </header>

  <section class="section">
    <h2 class="section-title">April 10 Objectives</h2>
    <div class="goals-grid" id="goalsGrid"></div>
  </section>

  <section class="section">
    <h2 class="section-title">Active Projects</h2>
    <div class="projects" id="projectCards"></div>
  </section>

  <section class="section">
    <h2 class="section-title">Data Infrastructure</h2>
    <div class="infra-grid" id="infraGrid"></div>
  </section>

  <section class="section">
    <h2 class="section-title">Fleet Pipeline</h2>
    <div class="funnel" id="funnel"></div>
  </section>

  <footer class="footer">
    <div class="footer-text">Leigen Command v1.0</div>
    <div class="footer-nav"><a href="/leigen/">Fleet Command</a></div>
  </footer>

</div>

<script>
(function() {
  var gate = document.getElementById('gate');
  var pw = document.getElementById('pw');
  var err = document.getElementById('err');

  if (sessionStorage.getItem('lg_cmd') === '1') {
    gate.classList.add('dismissed');
    loadDashboard();
    return;
  }

  pw.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (pw.value === 'bigbootylatina$') {
        sessionStorage.setItem('lg_cmd', '1');
        gate.style.opacity = '0';
        setTimeout(function() { gate.classList.add('dismissed'); loadDashboard(); }, 400);
      } else {
        err.classList.add('show');
        pw.value = '';
        setTimeout(function() { err.classList.remove('show'); }, 2000);
      }
    }
  });
  pw.focus();
})();

function loadDashboard() {
  fetch('data.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderCountdown(data.meta);
      renderGoals(data.goals);
      renderProjects(data.projects);
      renderInfra(data.infrastructure);
      renderFunnel(data.pipeline);
    })
    .catch(function(e) {
      console.error('Data load failed:', e);
    });
}

function formatDate(str) {
  var d = new Date(str + 'T12:00:00');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function renderCountdown(meta) {
  var target = new Date(meta.targetDate + 'T00:00:00');
  var now = new Date();
  now.setHours(0,0,0,0);
  var diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  var el = document.getElementById('countdown');

  if (diff > 0) {
    el.textContent = diff + ' days remaining';
  } else if (diff === 0) {
    el.textContent = 'Target day';
    el.className = 'countdown countdown-today';
  } else {
    el.textContent = Math.abs(diff) + ' days past target';
    el.className = 'countdown countdown-past';
  }

  document.getElementById('targetDate').textContent = formatDate(meta.targetDate);
  document.getElementById('lastUpdated').textContent = formatDate(meta.lastUpdated);
}

function renderGoals(goals) {
  var grid = document.getElementById('goalsGrid');
  var html = '';
  goals.forEach(function(g) {
    var icon, cls;
    if (g.status === 'done') { icon = '\u2713'; cls = 'goal-done'; }
    else if (g.status === 'in_progress') { icon = '\u25CF'; cls = 'goal-in-progress'; }
    else { icon = '\u25CB'; cls = 'goal-not-started'; }

    html += '<div class="goal-item ' + cls + '">' +
      '<span class="goal-icon">' + icon + '</span>' +
      '<div><div class="goal-text">' + g.text + '</div>' +
      (g.detail ? '<div class="goal-detail">' + g.detail + '</div>' : '') +
      '</div></div>';
  });
  grid.innerHTML = html;
}

function renderProjects(projects) {
  var container = document.getElementById('projectCards');
  var html = '';
  projects.forEach(function(p) {
    var slug = p.codename.toLowerCase();
    var progColor = p.progress >= 70 ? '#22c55e' : p.progress >= 30 ? '#f59e0b' : '#ef4444';
    var riskCls = 'risk-' + p.risk.toLowerCase();

    var todosHtml = '<div class="card-todos-inner"><div class="todos-label">To-do</div><ul class="todo-list">';
    p.todos.forEach(function(t) {
      var cls = t.done ? 'todo-done' : 'todo-pending';
      var icon = t.done ? '\u2713' : '\u25A1';
      todosHtml += '<li class="todo-item ' + cls + '"><span class="todo-check">' + icon + '</span><span>' + t.text + '</span></li>';
    });
    todosHtml += '</ul></div>';

    html += '<div class="project-card" id="card-' + slug + '" style="--accent:' + p.color + ';">' +
      '<div class="card-header" onclick="toggleCard(\'' + slug + '\')">' +
        '<div class="card-title-block">' +
          '<h3 class="card-codename">' + p.codename + '</h3>' +
          '<span class="card-former">formerly ' + p.formerName + '</span>' +
          '<p class="card-desc">' + p.description + '</p>' +
        '</div>' +
        '<div class="card-meta">' +
          '<span class="milestone-badge">' + p.milestone + '</span>' +
          '<span class="risk-badge ' + riskCls + '">' + p.risk + ' risk</span>' +
          '<span class="chevron">\u25BC</span>' +
        '</div>' +
      '</div>' +
      '<div class="card-progress">' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + p.progress + '%; background:' + progColor + ';"></div></div>' +
        '<span class="progress-pct" style="color:' + progColor + ';">' + p.progress + '%</span>' +
      '</div>' +
      (p.riskNote ? '<div class="risk-note">' + p.riskNote + '</div>' : '') +
      '<div class="card-todos">' + todosHtml + '</div>' +
    '</div>';
  });
  container.innerHTML = html;
}

function toggleCard(slug) {
  document.getElementById('card-' + slug).classList.toggle('open');
}

function renderInfra(infra) {
  var grid = document.getElementById('infraGrid');
  var html = '';
  infra.forEach(function(item) {
    var cls = 'status-' + item.status.toLowerCase();
    html += '<div class="infra-item ' + cls + '">' +
      '<span class="infra-dot"></span>' +
      '<span class="infra-name">' + item.name + '</span>' +
      (item.detail ? '<span class="infra-detail">' + item.detail + '</span>' : '') +
      '<span class="infra-badge">' + item.status + '</span>' +
    '</div>';
  });
  grid.innerHTML = html;
}

function renderFunnel(pipeline) {
  var container = document.getElementById('funnel');
  var stages = [
    { key: 'research', label: 'Research', color: '#5b8def' },
    { key: 'validation', label: 'Validation', color: '#8b5cf6' },
    { key: 'paper', label: 'Paper', color: '#f59e0b' },
    { key: 'live', label: 'Live', color: '#22c55e' }
  ];
  var html = '';
  stages.forEach(function(s, i) {
    html += '<div class="funnel-stage" style="--stage-color:' + s.color + ';">' +
      '<div class="funnel-count">' + pipeline[s.key] + '</div>' +
      '<div class="funnel-label">' + s.label + '</div></div>';
    if (i < stages.length - 1) html += '<div class="funnel-arrow">\u25B6</div>';
  });
  container.innerHTML = html;
}
</script>

</body>
</html>
