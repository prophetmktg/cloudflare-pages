<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Spectra Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #222633;
    --border: #2a2e3d;
    --text: #e4e4e7;
    --text-dim: #9ca3af;
    --text-muted: #6b7280;
    --accent: #3b82f6;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --yellow: #eab308;
    --yellow-bg: rgba(234,179,8,0.12);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --orange: #f97316;
    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* PASSWORD GATE */
  #passwordGate {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg); z-index: 99999;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  #passwordGate .gate-title {
    font-size: 32px; font-weight: 700; color: var(--accent);
    margin-bottom: 6px; letter-spacing: 3px;
  }
  #passwordGate .gate-sub {
    font-size: 12px; color: var(--text-muted); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 32px;
  }
  #passwordGate input {
    background: var(--surface); border: 2px solid var(--accent); color: var(--text);
    font-family: inherit; font-size: 16px; padding: 12px 24px;
    text-align: center; letter-spacing: 2px; outline: none;
    width: 280px; border-radius: 6px;
  }
  #passwordGate input:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
  }
  #passwordGate .gate-error {
    font-size: 12px; color: var(--red); margin-top: 12px;
    opacity: 0; transition: opacity 0.3s;
  }

  /* DASHBOARD */
  #dashboard { display: none; }

  .container {
    max-width: 1200px; margin: 0 auto; padding: 24px 20px;
  }

  /* STALE DATA BANNER */
  #staleBanner {
    display: none;
    background: #b91c1c; color: #ffffff;
    font-weight: 700; font-size: 15px;
    text-align: center; padding: 12px 16px;
    border-radius: 8px; margin-bottom: 20px;
    letter-spacing: 0.5px;
  }

  /* HEADER */
  .header {
    text-align: center; margin-bottom: 32px; padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 28px; font-weight: 700; letter-spacing: 3px;
    color: var(--accent); margin-bottom: 4px;
  }
  .header .subtitle {
    font-size: 13px; color: var(--text-muted); letter-spacing: 1px;
  }
  .header .updated {
    font-size: 11px; color: var(--text-muted); margin-top: 8px;
  }

  /* SECTIONS */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; margin-bottom: 20px;
  }
  .section-title {
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px;
  }

  /* WEEK NAV */
  .week-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 12px 0 4px; }
  .week-nav button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
  .week-nav button:hover { background: rgba(255,255,255,0.15); }
  .week-nav button:disabled { opacity: 0.3; cursor: default; }
  .week-nav .week-label { font-size: 14px; color: var(--text-muted); min-width: 200px; text-align: center; }
  .week-nav .week-label .current-badge { font-size: 11px; background: var(--accent); color: #0d1117; padding: 2px 6px; border-radius: 3px; margin-left: 8px; font-weight: 600; }

  /* HEATMAP */
  .heatmap-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .heatmap-table {
    border-collapse: collapse;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    white-space: nowrap;
  }
  .heatmap-table th {
    padding: 4px 6px;
    font-weight: 500;
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .heatmap-table th.date-header {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    transform: rotate(180deg);
    height: 70px;
    vertical-align: bottom;
    padding: 4px 2px;
    letter-spacing: 0;
  }
  .heatmap-table th.asset-header {
    text-align: left;
    padding: 4px 10px 4px 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    position: sticky;
    left: 0;
    background: var(--surface);
    z-index: 2;
    min-width: 90px;
  }
  .heatmap-table td {
    padding: 3px 4px;
    text-align: center;
    min-width: 36px;
    border-bottom: 1px solid rgba(42,46,61,0.3);
    font-weight: 600;
    font-size: 11px;
  }
  .heatmap-table td.asset-name {
    text-align: left;
    padding: 3px 10px 3px 6px;
    font-weight: 600;
    color: var(--text-dim);
    position: sticky;
    left: 0;
    background: var(--surface);
    z-index: 2;
    font-size: 11px;
  }
  .heatmap-table tr:hover td { background: var(--surface-hover); }
  .heatmap-table tr:hover td.asset-name { background: var(--surface-hover); }

  /* Heatmap cell colors */
  .hm-flat { color: var(--text-muted); }
  .hm-up-small { background: rgba(34,197,94,0.10); color: var(--green); }
  .hm-up-big { background: rgba(34,197,94,0.25); color: var(--green); }
  .hm-down-small { background: rgba(239,68,68,0.10); color: var(--red); }
  .hm-down-big { background: rgba(239,68,68,0.25); color: var(--red); }
  .hm-no-data { color: var(--text-muted); opacity: 0.3; }

  /* Bias badge next to asset name */
  .bias-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .bias-dot.bullish { background: var(--green); }
  .bias-dot.bearish { background: var(--red); }
  .bias-dot.neutral { background: var(--text-muted); }

  /* MOMENTUM */
  .momentum-tabs {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .momentum-tabs button {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .momentum-tabs button:hover { background: rgba(255,255,255,0.12); }
  .momentum-tabs button.active {
    background: var(--accent);
    color: #0d1117;
    border-color: var(--accent);
  }

  .momentum-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .momentum-panel h3 {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .momentum-panel h3.gainers { color: var(--green); }
  .momentum-panel h3.losers { color: var(--red); }

  .momentum-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .momentum-table th {
    text-align: left; padding: 6px 8px; color: var(--text-muted);
    font-weight: 500; font-size: 11px; letter-spacing: 0.5px;
    text-transform: uppercase; border-bottom: 1px solid var(--border);
  }
  .momentum-table td {
    padding: 6px 8px; border-bottom: 1px solid rgba(42,46,61,0.5);
    color: var(--text-dim);
  }
  .momentum-table tr:last-child td { border-bottom: none; }

  .ticker {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
    font-weight: 600; background: var(--blue-bg); color: var(--accent);
  }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  }
  .badge-bullish { background: var(--green-bg); color: var(--green); }
  .badge-bearish { background: var(--red-bg); color: var(--red); }
  .badge-neutral { background: rgba(107,114,128,0.15); color: var(--text-muted); }

  .delta-val {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-weight: 700; font-size: 13px;
  }
  .delta-val.positive { color: var(--green); }
  .delta-val.negative { color: var(--red); }
  .delta-val.zero { color: var(--text-muted); }

  /* EMPTY STATE */
  .empty {
    text-align: center; padding: 20px; color: var(--text-muted);
    font-size: 13px; font-style: italic;
  }

  /* FOOTER */
  .freshness {
    display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;
    padding: 16px; font-size: 11px; color: var(--text-muted);
  }
  .freshness span { white-space: nowrap; }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .container { padding: 16px 12px; }
    .section { padding: 14px; }
    .header h1 { font-size: 22px; }
    .momentum-grid { grid-template-columns: 1fr; }
    .momentum-table th, .momentum-table td { padding: 5px 6px; font-size: 12px; }
    .heatmap-table th.date-header { height: 50px; }
  }
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="passwordGate">
  <div class="gate-title">SPECTRA</div>
  <div class="gate-sub">EdgeFinder Intelligence</div>
  <input type="password" id="gateInput" placeholder="Access code" autofocus>
  <div class="gate-error" id="gateError">Incorrect</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>SPECTRA</h1>
      <div class="subtitle">EdgeFinder Intelligence Dashboard</div>
      <div class="updated" id="lastUpdated"></div>
      <div class="week-nav" id="weekNav" style="display:none">
        <button id="prevWeek" title="Previous week">&larr;</button>
        <div class="week-label" id="weekLabel"></div>
        <button id="nextWeek" title="Next week">&rarr;</button>
      </div>
    </div>

    <!-- MOMENTUM LEADERS -->
    <div class="section" id="momentumSection">
      <div class="section-title">Momentum Leaders</div>
      <div class="momentum-tabs" id="momentumTabs">
        <button class="tab" data-window="1">1D</button>
        <button class="tab active" data-window="3">3D</button>
        <button class="tab" data-window="5">5D</button>
        <button class="tab" data-window="7">7D</button>
        <button class="tab" data-window="14">14D</button>
      </div>
      <div id="momentumContent"></div>
    </div>

    <!-- DAILY SCORE HEATMAP -->
    <div class="section" id="heatmapSection">
      <div class="section-title">Daily Score Heatmap</div>
      <div class="heatmap-wrapper" id="heatmapWrapper"></div>
    </div>

    <!-- FRESHNESS FOOTER -->
    <div class="freshness" id="freshness"></div>

  </div>
</div>

<script>
// -- Utilities --
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatDate(s) {
  if (!s) return '-';
  var ds = (s.length === 10) ? s + 'T12:00:00' : s;
  var d = new Date(ds);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatShortDate(s) {
  if (!s) return '-';
  var ds = s + 'T12:00:00';
  var d = new Date(ds);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateTime(s) {
  if (!s) return '-';
  var d = new Date(s);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function biasClass(b) {
  if (!b) return 'neutral';
  var bl = b.toLowerCase();
  if (bl.indexOf('bullish') >= 0) return 'bullish';
  if (bl.indexOf('bearish') >= 0) return 'bearish';
  return 'neutral';
}

// -- Password Gate --
var gate = document.getElementById('passwordGate');
var dashboard = document.getElementById('dashboard');
var gateInput = document.getElementById('gateInput');
var gateError = document.getElementById('gateError');

function unlockDashboard() {
  gate.style.display = 'none';
  dashboard.style.display = 'block';
  loadDashboard();
  initWeekNav();
}

if (localStorage.getItem('spectra_auth') === 'true') {
  unlockDashboard();
}

gateInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (gateInput.value === 'spectra') {
      localStorage.setItem('spectra_auth', 'true');
      gate.style.transition = 'opacity 0.4s';
      gate.style.opacity = '0';
      setTimeout(unlockDashboard, 400);
    } else {
      gateError.style.opacity = '1';
      gateInput.value = '';
      setTimeout(function() { gateError.style.opacity = '0'; }, 2000);
    }
  }
});

// -- Global data reference for momentum tab switching --
var currentData = null;
var activeWindow = 3;

// -- Render Functions --

function renderHeatmap(data) {
  var container = document.getElementById('heatmapWrapper');
  var hm = data.heatmap;

  if (!hm || !hm.dates || hm.dates.length === 0) {
    container.innerHTML = '<div class="empty">No heatmap data available</div>';
    return;
  }

  var dates = hm.dates;
  var assets = hm.assets;
  var scores = hm.scores;
  var deltas = hm.deltas;
  var biases = hm.biases || {};

  var html = '<table class="heatmap-table"><thead><tr>';
  html += '<th class="asset-header">Asset</th>';
  for (var i = 0; i < dates.length; i++) {
    html += '<th class="date-header">' + formatShortDate(dates[i]) + '</th>';
  }
  html += '</tr></thead><tbody>';

  for (var a = 0; a < assets.length; a++) {
    var sym = assets[a];
    var bc = biasClass(biases[sym] || '');
    html += '<tr>';
    html += '<td class="asset-name"><span class="bias-dot ' + bc + '"></span>' + esc(sym) + '</td>';

    var symScores = scores[sym] || {};
    var symDeltas = deltas[sym] || {};

    for (var d = 0; d < dates.length; d++) {
      var dt = dates[d];
      var score = symScores[dt];
      var delta = symDeltas[dt];
      var cellClass = 'hm-flat';
      var cellText = '';

      if (score == null) {
        cellClass = 'hm-no-data';
        cellText = '\u2014';
      } else {
        cellText = (score >= 0 ? '+' : '') + score;
        if (delta == null || delta === 0) {
          cellClass = 'hm-flat';
        } else if (delta >= 3) {
          cellClass = 'hm-up-big';
        } else if (delta >= 1) {
          cellClass = 'hm-up-small';
        } else if (delta <= -3) {
          cellClass = 'hm-down-big';
        } else if (delta <= -1) {
          cellClass = 'hm-down-small';
        }
      }

      var title = sym + ' ' + dt + ': score ' + score + ', change ' + (delta != null ? ((delta >= 0 ? '+' : '') + delta) : 'n/a');
      html += '<td class="' + cellClass + '" title="' + esc(title) + '">' + cellText + '</td>';
    }
    html += '</tr>';
  }

  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderMomentum(data) {
  currentData = data;
  var tabs = document.querySelectorAll('#momentumTabs .tab');
  tabs.forEach(function(btn) {
    btn.addEventListener('click', function() {
      tabs.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeWindow = parseInt(btn.getAttribute('data-window'));
      renderMomentumTable();
    });
  });
  renderMomentumTable();
}

function renderMomentumTable() {
  var container = document.getElementById('momentumContent');
  if (!currentData || !currentData.momentum || !currentData.momentum.data) {
    container.innerHTML = '<div class="empty">No momentum data available</div>';
    return;
  }

  var items = currentData.momentum.data.slice();
  var deltaKey = 'delta_' + activeWindow + 'd';

  // Sort by the active window's delta
  items.sort(function(a, b) {
    var da = a[deltaKey]; var db = b[deltaKey];
    if (da == null && db == null) return 0;
    if (da == null) return 1;
    if (db == null) return -1;
    return db - da; // descending for gainers first
  });

  // Split gainers and losers
  var gainers = items.filter(function(m) { return m[deltaKey] != null && m[deltaKey] > 0; });
  var losers = items.filter(function(m) { return m[deltaKey] != null && m[deltaKey] < 0; });
  losers.sort(function(a, b) { return a[deltaKey] - b[deltaKey]; }); // most negative first

  var html = '<div class="momentum-grid">';

  // Gainers
  html += '<div class="momentum-panel">';
  html += '<h3 class="gainers">Gainers (' + activeWindow + 'D)</h3>';
  if (gainers.length === 0) {
    html += '<div class="empty">No gainers</div>';
  } else {
    html += buildMomentumTable(gainers.slice(0, 15), deltaKey);
  }
  html += '</div>';

  // Losers
  html += '<div class="momentum-panel">';
  html += '<h3 class="losers">Losers (' + activeWindow + 'D)</h3>';
  if (losers.length === 0) {
    html += '<div class="empty">No losers</div>';
  } else {
    html += buildMomentumTable(losers.slice(0, 15), deltaKey);
  }
  html += '</div>';

  html += '</div>';
  container.innerHTML = html;
}

function buildMomentumTable(items, deltaKey) {
  var html = '<table class="momentum-table"><thead><tr>';
  html += '<th>Symbol</th><th>Score</th><th>Bias</th><th>Delta</th>';
  html += '</tr></thead><tbody>';

  for (var i = 0; i < items.length; i++) {
    var m = items[i];
    var delta = m[deltaKey];
    var deltaClass = delta > 0 ? 'positive' : delta < 0 ? 'negative' : 'zero';
    var bc = biasClass(m.current_bias || '');
    var biasLabel = (m.current_bias || '').replace(/_/g, ' ');

    html += '<tr>';
    html += '<td><span class="ticker">' + esc(m.symbol) + '</span></td>';
    html += '<td style="font-family:monospace;font-weight:600">' + (m.current_score >= 0 ? '+' : '') + m.current_score + '</td>';
    html += '<td><span class="badge badge-' + bc + '">' + esc(biasLabel) + '</span></td>';
    html += '<td><span class="delta-val ' + deltaClass + '">' + (delta >= 0 ? '+' : '') + delta + '</span></td>';
    html += '</tr>';
  }

  html += '</tbody></table>';
  return html;
}

function renderStaleBanner(data, isLive) {
  var banner = document.getElementById('staleBanner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'staleBanner';
    var c = document.querySelector('.container');
    c.insertBefore(banner, c.firstChild);
  }
  var exported = data._meta && data._meta.exported_at;
  if (!isLive || !exported) { banner.style.display = 'none'; return; }
  var ageDays = (Date.now() - new Date(exported).getTime()) / 86400000;
  // Allowance covers weekends: a Friday 3pm export is still fresh Sun/Mon morning.
  var dow = new Date().getDay();
  var allowance = (dow === 1) ? 3.5 : (dow === 0) ? 2.5 : 1.5;
  if (ageDays > allowance) {
    banner.textContent = '⚠ STALE DATA — last updated ' + formatDateTime(exported) +
      '. The Spectra pipeline has not run; scores below are outdated.';
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }
}

function renderFreshness(data) {
  var meta = data._meta || {};
  var el = document.getElementById('freshness');
  var parts = [];
  if (meta.exported_at) parts.push('Exported: ' + formatDateTime(meta.exported_at));
  if (data.context_date) parts.push('Context: ' + formatDate(data.context_date));
  if (meta.asset_count) parts.push(meta.asset_count + ' assets');
  if (meta.date_count) parts.push(meta.date_count + ' days');
  if (meta.spectra_version) parts.push('Spectra v' + meta.spectra_version);
  el.innerHTML = parts.map(function(p) { return '<span>' + esc(p) + '</span>'; }).join('');
}

// -- Week Navigation State --
var availableWeeks = [];
var currentWeekIdx = -1;
var currentWeekAnchor = 0;

function getCurrentWeekId() {
  var now = new Date();
  var d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  var dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-W' + (weekNo < 10 ? '0' : '') + weekNo;
}

function initWeekNav() {
  fetch('snapshots/index.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(manifest) {
      availableWeeks = manifest.weeks || [];
      availableWeeks.sort(function(a, b) { return b.id.localeCompare(a.id); });
      var curId = getCurrentWeekId();
      currentWeekAnchor = 0;
      for (var i = 0; i < availableWeeks.length; i++) {
        if (availableWeeks[i].id < curId) { currentWeekAnchor = i; break; }
      }
      if (availableWeeks.length > 0) {
        document.getElementById('weekNav').style.display = 'flex';
        updateWeekLabel();
      }
    })
    .catch(function() {});

  document.getElementById('prevWeek').addEventListener('click', function() {
    var maxIdx = availableWeeks.length - 1;
    var nextIdx = (currentWeekIdx === -1) ? currentWeekAnchor : currentWeekIdx + 1;
    if (nextIdx <= maxIdx) {
      currentWeekIdx = nextIdx;
      loadWeek();
    }
  });
  document.getElementById('nextWeek').addEventListener('click', function() {
    if (currentWeekIdx > -1) {
      if (currentWeekIdx <= currentWeekAnchor) {
        currentWeekIdx = -1;
      } else {
        currentWeekIdx--;
      }
      loadWeek();
    }
  });
}

function updateWeekLabel() {
  var label = document.getElementById('weekLabel');
  var prevBtn = document.getElementById('prevWeek');
  var nextBtn = document.getElementById('nextWeek');

  if (currentWeekIdx === -1) {
    label.innerHTML = 'Current Week<span class="current-badge">LIVE</span>';
  } else {
    var week = availableWeeks[currentWeekIdx];
    label.innerHTML = week ? week.label : '';
  }

  nextBtn.disabled = (currentWeekIdx <= -1);
  prevBtn.disabled = (currentWeekIdx >= availableWeeks.length - 1);
}

function loadWeek() {
  var url = (currentWeekIdx === -1)
    ? 'dashboard.json?t=' + Date.now()
    : 'snapshots/' + availableWeeks[currentWeekIdx].id + '.json?t=' + Date.now();

  updateWeekLabel();
  loadDashboard(url);
}

// -- Load Dashboard --
function loadDashboard(url) {
  if (!url) url = 'dashboard.json?t=' + Date.now();

  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      document.getElementById('lastUpdated').textContent =
        'Context: ' + formatDate(data.context_date) +
        (data._meta && data._meta.exported_at ? ' | Updated: ' + formatDateTime(data._meta.exported_at) : '');

      renderHeatmap(data);
      renderMomentum(data);
      renderFreshness(data);
      renderStaleBanner(data, url.indexOf('dashboard.json') === 0);
    })
    .catch(function(err) {
      document.querySelector('.container').innerHTML =
        '<div class="empty" style="padding:60px">Failed to load dashboard data. ' + esc(err.message) + '</div>';
    });
}
</script>
</body>
</html>
