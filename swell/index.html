<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Swell Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #222633;
    --border: #2a2e3d;
    --text: #e4e4e7;
    --text-dim: #9ca3af;
    --text-muted: #6b7280;
    --accent: #3b82f6;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --yellow: #eab308;
    --yellow-bg: rgba(234,179,8,0.12);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --orange: #f97316;
    --orange-bg: rgba(249,115,22,0.12);
    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,0.12);
    --pink: #ec4899;
    --pink-bg: rgba(236,72,153,0.12);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,0.12);
    --gray-bg: rgba(107,114,128,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* PASSWORD GATE */
  #passwordGate {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg); z-index: 99999;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  #passwordGate .gate-title {
    font-size: 28px; font-weight: 700; color: var(--accent);
    margin-bottom: 6px; letter-spacing: 1px;
  }
  #passwordGate .gate-sub {
    font-size: 12px; color: var(--text-muted); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 32px;
  }
  #passwordGate input {
    background: var(--surface); border: 2px solid var(--accent); color: var(--text);
    font-family: inherit; font-size: 16px; padding: 12px 24px;
    text-align: center; letter-spacing: 2px; outline: none;
    width: 280px; border-radius: 6px;
  }
  #passwordGate input:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
  }
  #passwordGate .gate-error {
    font-size: 12px; color: var(--red); margin-top: 12px;
    opacity: 0; transition: opacity 0.3s;
  }

  /* DASHBOARD */
  #dashboard { display: none; }

  .container {
    max-width: 1100px; margin: 0 auto; padding: 24px 20px;
  }

  .header {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 2px solid var(--accent); padding-bottom: 12px;
    margin-bottom: 24px; flex-wrap: wrap; gap: 8px;
  }
  .header h1 {
    font-size: 24px; font-weight: 700; color: var(--text);
    letter-spacing: 0.5px;
  }
  .header .timestamp {
    font-size: 12px; color: var(--text-muted);
  }

  /* DATE TABS */
  .date-tabs {
    display: flex; gap: 6px; margin-bottom: 20px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .date-tab {
    padding: 8px 16px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
    font-size: 13px; font-weight: 500;
    white-space: nowrap; transition: all 0.15s;
  }
  .date-tab:hover { background: var(--surface-hover); color: var(--text); }
  .date-tab.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600;
  }

  /* TREND TABLE */
  .trends-table {
    width: 100%; border-collapse: collapse;
  }
  .trends-table thead th {
    text-align: left; padding: 10px 12px;
    border-bottom: 2px solid var(--border);
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text-muted);
    font-weight: 600; white-space: nowrap;
  }
  .trends-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .trends-table tbody tr:hover { background: var(--surface-hover); }
  .trends-table td {
    padding: 12px; font-size: 14px; vertical-align: middle;
  }
  .trends-table td.rank {
    color: var(--text-muted); font-weight: 600;
    font-size: 13px; width: 40px; text-align: center;
  }
  .trends-table td.keyword-cell {
    font-weight: 600; min-width: 160px;
  }

  /* BADGES */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .badge-new { background: var(--orange-bg); color: var(--orange); }
  .badge-high { background: var(--green-bg); color: var(--green); }
  .badge-medium { background: var(--yellow-bg); color: var(--yellow); }
  .badge-low { background: var(--gray-bg); color: var(--text-muted); }
  .badge-rising { color: var(--green); }
  .badge-falling { color: var(--red); }
  .badge-mixed { color: var(--text-muted); }

  .badge-emerging { background: var(--blue-bg); color: var(--blue); }
  .badge-accelerating { background: var(--green-bg); color: var(--green); }
  .badge-peaking { background: var(--amber-bg); color: var(--amber); }
  .badge-re-accelerating { background: var(--pink-bg); color: var(--pink); }
  .badge-plateauing { background: var(--gray-bg); color: var(--text-muted); }
  .badge-declining { background: var(--red-bg); color: var(--red); }

  .ticker {
    display: inline-block; padding: 2px 6px; border-radius: 3px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 11px; font-weight: 600;
    background: var(--blue-bg); color: var(--blue);
    margin: 1px 2px;
  }

  .tickers-cell { min-width: 80px; }

  .score-cell {
    font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .accel-cell {
    font-variant-numeric: tabular-nums;
  }
  .accel-positive { color: var(--green); }
  .accel-negative { color: var(--red); }

  .sources-cell {
    text-align: center; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .direction-icon { font-size: 16px; }

  /* SOURCE DETAILS (expandable row) */
  .detail-row td {
    padding: 0 12px 12px 52px;
    border-bottom: 1px solid var(--border);
  }
  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .source-detail {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; margin: 2px 4px;
    font-size: 12px; color: var(--text-dim);
  }
  .source-detail .src-name {
    font-weight: 600; color: var(--text);
    text-transform: capitalize;
  }
  .source-detail .src-accel { font-weight: 600; }

  .expand-btn {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 12px; padding: 2px 4px;
    transition: transform 0.15s;
  }
  .expand-btn.open { transform: rotate(90deg); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state p { font-size: 16px; margin-bottom: 8px; }
  .empty-state .sub { font-size: 13px; }

  /* LOADING */
  .loading {
    text-align: center; padding: 60px; color: var(--text-muted);
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .container { padding: 16px 12px; }
    .header h1 { font-size: 20px; }
    .trends-table { display: block; overflow-x: auto; }
    .date-tab { padding: 6px 12px; font-size: 12px; }
    .trends-table td { padding: 8px 6px; font-size: 13px; }
    .trends-table thead th { padding: 8px 6px; font-size: 10px; }
    /* Hide less critical columns on mobile */
    .col-sources, .col-phase { display: none; }
  }
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="passwordGate">
  <div style="text-align:center;">
    <div class="gate-title">Swell Dashboard</div>
    <div class="gate-sub">Private Access</div>
    <input id="passwordInput" type="password" placeholder="Access code" autocomplete="off">
    <div id="passwordError" class="gate-error">Access denied</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="container">
    <div class="header">
      <h1>Swell Dashboard</h1>
      <span class="timestamp" id="genTimestamp"></span>
    </div>
    <div class="date-tabs" id="dateTabs"></div>
    <div id="tableContainer">
      <div class="loading">Loading dashboard data...</div>
    </div>
  </div>
</div>

<script>
(function() {
  // Password gate
  var gate = document.getElementById('passwordGate');
  var input = document.getElementById('passwordInput');
  var error = document.getElementById('passwordError');
  var dashboard = document.getElementById('dashboard');

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (input.value === 'swell') {
        gate.style.transition = 'opacity 0.4s';
        gate.style.opacity = '0';
        setTimeout(function() {
          gate.style.display = 'none';
          dashboard.style.display = 'block';
          loadDashboard();
        }, 400);
      } else {
        error.style.opacity = '1';
        input.value = '';
        setTimeout(function() { error.style.opacity = '0'; }, 2000);
      }
    }
  });
  input.focus();

  var dashboardData = null;
  var activeDay = 0;

  function loadDashboard() {
    fetch('dashboard.json?t=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        dashboardData = data;
        document.getElementById('genTimestamp').textContent =
          'Updated ' + formatTimestamp(data.generated);
        renderDateTabs(data.days);
        if (data.days.length > 0) {
          selectDay(0);
        } else {
          document.getElementById('tableContainer').innerHTML =
            '<div class="empty-state"><p>No data available</p><p class="sub">Run the Swell pipeline to generate trend data.</p></div>';
        }
      })
      .catch(function(err) {
        document.getElementById('tableContainer').innerHTML =
          '<div class="empty-state"><p>Failed to load dashboard data</p><p class="sub">' + err.message + '</p></div>';
      });
  }

  function formatTimestamp(ts) {
    var d = new Date(ts);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() +
      ' at ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function formatDate(dateStr) {
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
  }

  function renderDateTabs(days) {
    var container = document.getElementById('dateTabs');
    container.innerHTML = '';
    days.forEach(function(day, i) {
      var tab = document.createElement('button');
      tab.className = 'date-tab' + (i === 0 ? ' active' : '');
      tab.textContent = formatDate(day.date);
      tab.setAttribute('data-index', i);
      tab.addEventListener('click', function() { selectDay(i); });
      container.appendChild(tab);
    });
  }

  function selectDay(index) {
    activeDay = index;
    // Update tab styling
    var tabs = document.querySelectorAll('.date-tab');
    tabs.forEach(function(t, i) {
      t.className = 'date-tab' + (i === index ? ' active' : '');
    });
    renderTable(dashboardData.days[index]);
  }

  function renderTable(day) {
    var container = document.getElementById('tableContainer');
    if (!day || !day.trends || day.trends.length === 0) {
      container.innerHTML = '<div class="empty-state"><p>No trends for this date</p></div>';
      return;
    }

    var html = '<table class="trends-table">';
    html += '<thead><tr>';
    html += '<th></th>';
    html += '<th>#</th>';
    html += '<th>Keyword</th>';
    html += '<th>Tickers</th>';
    html += '<th>Score</th>';
    html += '<th>Acceleration</th>';
    html += '<th class="col-sources">Sources</th>';
    html += '<th>Direction</th>';
    html += '<th class="col-phase">Phase</th>';
    html += '<th>Conviction</th>';
    html += '</tr></thead><tbody>';

    day.trends.forEach(function(trend, i) {
      var rowId = 'row-' + i;

      // Main row
      html += '<tr onclick="toggleDetail(\'' + rowId + '\', this)" style="cursor:pointer;">';
      html += '<td><button class="expand-btn" id="btn-' + rowId + '">&#9654;</button></td>';
      html += '<td class="rank">' + (i + 1) + '</td>';

      // Keyword + novel badge
      html += '<td class="keyword-cell">' + escHtml(trend.keyword);
      if (trend.is_novel) html += ' <span class="badge badge-new">NEW</span>';
      html += '</td>';

      // Tickers
      html += '<td class="tickers-cell">';
      if (trend.tickers && trend.tickers.length > 0) {
        trend.tickers.forEach(function(t) {
          html += '<span class="ticker">' + escHtml(t) + '</span>';
        });
      } else {
        html += '<span style="color:var(--text-muted);">--</span>';
      }
      html += '</td>';

      // Score
      html += '<td class="score-cell">' + trend.score.toFixed(1) + '</td>';

      // Acceleration
      var accelClass = trend.acceleration >= 0 ? 'accel-positive' : 'accel-negative';
      var accelSign = trend.acceleration >= 0 ? '+' : '';
      html += '<td class="accel-cell ' + accelClass + '">' + accelSign + trend.acceleration.toFixed(0) + '%</td>';

      // Sources
      html += '<td class="sources-cell col-sources">' + trend.sources + '</td>';

      // Direction
      var dirIcon = '';
      var dirClass = '';
      if (trend.direction === 'rising') { dirIcon = '\u25B2'; dirClass = 'badge-rising'; }
      else if (trend.direction === 'falling') { dirIcon = '\u25BC'; dirClass = 'badge-falling'; }
      else if (trend.direction === 'mixed') { dirIcon = '\u25C6'; dirClass = 'badge-mixed'; }
      html += '<td><span class="direction-icon ' + dirClass + '">' + dirIcon + '</span></td>';

      // Phase
      var phaseClass = 'badge-' + (trend.phase || '').replace(/[^a-z-]/gi, '').toLowerCase();
      html += '<td class="col-phase">';
      if (trend.phase) {
        html += '<span class="badge ' + phaseClass + '">' + escHtml(trend.phase) + '</span>';
      }
      html += '</td>';

      // Conviction
      var convClass = 'badge-' + (trend.conviction || 'low');
      html += '<td><span class="badge ' + convClass + '">' + (trend.conviction || 'low').toUpperCase() + '</span></td>';

      html += '</tr>';

      // Detail row (source breakdown)
      html += '<tr class="detail-row" id="' + rowId + '"><td colspan="10">';
      if (trend.source_details && trend.source_details.length > 0) {
        trend.source_details.forEach(function(sd) {
          var sdAccelClass = sd.acceleration >= 0 ? 'accel-positive' : 'accel-negative';
          var sdSign = sd.acceleration >= 0 ? '+' : '';
          html += '<span class="source-detail">';
          html += '<span class="src-name">' + escHtml(formatSourceName(sd.source)) + '</span>';
          html += '<span>val: ' + Math.round(sd.value) + '</span>';
          html += '<span>base: ' + Math.round(sd.baseline) + '</span>';
          html += '<span class="src-accel ' + sdAccelClass + '">' + sdSign + sd.acceleration.toFixed(0) + '%</span>';
          html += '</span>';
        });
      }
      html += '</td></tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function formatSourceName(s) {
    return s.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  }

  function escHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Global toggle function for detail rows
  window.toggleDetail = function(rowId, parentRow) {
    var row = document.getElementById(rowId);
    var btn = document.getElementById('btn-' + rowId);
    if (row) {
      var isOpen = row.classList.contains('open');
      row.classList.toggle('open');
      if (btn) btn.classList.toggle('open');
    }
  };
})();
</script>
</body>
</html>
